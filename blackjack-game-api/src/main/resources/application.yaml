spring:
  profiles:
    active: dev

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/blackjack}
      database: blackjack
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  r2dbc:
    url: ${MYSQL_URL:r2dbc:mysql://localhost:3307/blackjack}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:secret}
    pool:
      initial-size: 10
      max-size: 20
      validation-query: SELECT 1

  cache:
    type: redis
    cache-names: ranking,player
    redis:
      time-to-live: 60000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    cat.opteams.blackjack: DEBUG
    org.springframework.data.r2dbc: DEBUG
    org.springframework.data.mongodb: DEBUG

# CORS Configuration (amb valors per defecte)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:8080}
  allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,PATCH,OPTIONS}
  max-age: ${CORS_MAX_AGE:3600}

# Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

